name: PR Tests

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Fawkes/Fawkes.Tests/Fawkes.Tests.csproj

      - name: Build
        run: dotnet build Fawkes/Fawkes.Tests/Fawkes.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Fawkes/Fawkes.Tests/Fawkes.Tests.csproj --configuration Release --no-build --verbosity normal
